name: tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  jest:
    runs-on: ubuntu-20.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      
      - name: cache .npm
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        env:
          cache-name: npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm install
      - run: npm run testForGithubOrRedisEnthusiasts

  eslint:
      runs-on: ubuntu-20.04
      timeout-minutes: 5
      steps:
        - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
          with:
            ref: ${{ github.head_ref }}
        - name: cache .npm
          uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
          env:
            cache-name: npm
          with:
            path: ~/.npm
            key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        - run: npm install
        - name: Lint
          run: npm run lint:github
