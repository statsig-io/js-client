name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dryrun:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v2
      - name: cache .npm
        uses: actions/cache@v2
        env:
          cache-name: npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install
        run: npm install

      - name: Build
        run: npm run build:dryrun
